# as an origin or destination anywhere above or in fact_pipe_flow_hist), not
# hand-typed, so the list cannot silently miss an island/isolated country
# this file's author did not think to name. The task's own worked examples
# are asserted against that computed set below; a mismatch is reported, not
# silently reconciled.
# ---------------------------------------------------------------------------
