# Session 8, STEP 1: every invented current-year flow value stripped
# unconditionally. Session 7 wrote 249 bcma for CA-US with a citation
# attached; EA's own fact_net_gas_position puts Canada's entire 2030 surplus
# at 81.3 bcm, so that corridor alone implied Canada importing 183 bcm of
# LNG it never called for -- a cited wrong number survived review. The split
# session 7 drew between "sourced" and "invented" was that session's own
# account of its own behaviour and is not verifiable (CA-US 249 was
# self-reported as genuinely sourced and is exactly the falsified one), so
# nothing here is preserved on the grounds that it looked sourced. Every
# corridor below is an entry awaiting a person's number, not a data point.
#
# Session 8, STEP 3: the schema is split into two zones per corridor so this
# cannot recur through wording alone.
#   Tool-writable  -- origin_iso2, destination_iso2, adjacency_flag (a
#                     derived geometry fact, not a flow judgement).
#   Analyst-only   -- current_flow_bcma, basis_year, continuation (and
#                     everything nested in it: path, target_flow_bcma,
#                     target_year, terminal_year, lookback_years), source.
#                     pipe_flow_forecast.validate_analyst_provenance raises
#                     if any analyst-only field is populated without a
#                     matching entered_by and entered_on on the same
#                     corridor -- a value with no name and no date attached
#                     to it is exactly how the CA-US number happened again.
# `entered_by` and `entered_on` are themselves analyst-only fields: a corridor
# with a null current_flow_bcma is incomplete, not zero, and carries null
# entered_by/entered_on too until a person fills the whole row in together.
#
# basis values used throughout this file and in fact_pipe_net_position:
#   measured       -- IEA GTF border-point flow, an observed year.
#   assumed        -- an analyst-stated current flow and/or continuation.
#   explicit_zero  -- a modelled country with no cross-border pipe at all,
#                      stated as zero rather than left as an absence.
#   undecided      -- a named corridor exists but the analyst has not yet
#                      supplied a defensible number. Never zero-filled.
#
# Numbers here are current-year point estimates and continuation paths, not
# capacity x availability x ramp (per the session 7 task: one number, not
# three). Every filled number must carry entered_by and entered_on; every
# unfilled one is null, per CLAUDE.md ("a null beats a plausible invented
# number").

scope:
  modelled_countries_source: "session 6 fact_net_gas_position: countries with at least one (country, year) row carrying both supply and demand"
  horizon_start: 2025
  horizon_end: 2050
  history_start: 2008 # only populated for corridors GTF actually measures

# ---------------------------------------------------------------------------
# STEP 3 (measured corridors). Continuation for the GTF corridors past their
# last observed year. Rather than hand-typing a continuation for every one, a
# single default rule applies to all of them, with named overrides only for
# corridors where a default flat continuation would be a poor read of
# already-visible facts (a war, a contract, a field decline). This is a
# continuation METHOD (which of the corridor's own already-measured years to
# average), not an invented flow value -- every number it produces is a
# GTF-observed one, so it is out of scope for the STEP 1 strip. Session 8
# leaves it as session 7 built it.
# ---------------------------------------------------------------------------
measured_corridor_default_continuation:
  path: flat
  # Average of up to this many of the corridor's own most recent *complete*
  # observed years (a year with fewer than 12 distinct months in the GTF
  # file, e.g. the current partial year, is excluded from the average, not
  # rounded up to a full year's rate).
  lookback_years: 3
  note: >
    Default for any GTF-measured corridor without a named override below:
    hold flat at that corridor's own recent-year average. This already
    reflects disruptions visible in the GTF history itself (e.g. RU-DE and
    RU-FI are already at zero in the most recent complete years, so "flat"
    projects continued zero without a named override being needed).

measured_corridor_overrides:
  - origin_iso2: RU
    destination_iso2: TR
    path: flat
    lookback_years: 2
    note: >
      TurkStream. The most recent complete year is used with a 2-year
      (not the 3-year default) lookback because the corridor stepped up
      materially in 2021-2022 versus its pre-2021 level and a 3-year window
      would understate the post-step level; 2026 is partial-year and
      excluded from the average by the standard rule above.
    source: iea_gtf_202606

# ---------------------------------------------------------------------------
# STEP 2 + STEP 3 (hand-listed corridors outside GTF coverage). Corridor
# identity is a fact (this pair carries physical gas, GTF just doesn't
# measure it); the flow magnitude is not. Every current_flow_bcma,
# basis_year, continuation and source below is null, stripped by session 8
# STEP 1 without exception. A corridor stays in this list because the pipe
# is real -- the number is awaiting an analyst, named entered_by and dated
# entered_on, per STEP 3's schema split above.
#
# continuation.path is one of: flat, growing, declining, terminating,
# undecided -- undecided (or a null current_flow_bcma) is the state of
# every corridor below.
# adjacency_flag is set where dim_country_adjacency (geometric adjacency +
# the signed-off crosswalks/adjacency_override.csv) has neither a direct
# border nor an override row for the pair -- the check build plan session 3
# already built (pipe_checks.check_gtf_adjacency), reused here rather than
# re-implemented. This is a derived geometry fact, tool-writable, not an
# analyst judgement, so it survives the strip.
# ---------------------------------------------------------------------------
