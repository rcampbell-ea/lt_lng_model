# ---------------------------------------------------------------------------
# STEP 5 (of session 7). Modelled countries with no cross-border pipe at all
# -- computed by build_session7.py as (modelled countries) minus (every
# country appearing as an origin or destination anywhere above or in
# fact_pipe_flow_hist), not hand-typed. This is a structural finding (a
# country has no named corridor at all), not an invented flow magnitude, so
# it is out of scope for the STEP 1 strip and is left exactly as session 7
# built it.
# ---------------------------------------------------------------------------
zero_countries_expected:
