  - origin_iso2: ID
    destination_iso2: SG
    current_flow_bcma: null
    basis_year: null
    continuation: {path: undecided}
    source: null
    adjacency_flag: true
    note: >
      Subsea pipeline (West Natuna / South Sumatra to Singapore), not a
      shared land border -- a real named link (candidate for
      crosswalks/adjacency_override.csv, flagged for sign-off, not added by
      this session), not a data error. No corridor-isolated bcm figure
      found; direction is known (Indonesia is redirecting West Natuna gas to
