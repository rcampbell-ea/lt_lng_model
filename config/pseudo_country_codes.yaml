# The six pseudo codes from section 4.4 of docs/LT_LNG_flows_forecast_plan.md
# and section 4.3 of docs/sessions_00_01_build_plan.md, plus XX, added in
# session 2 per docs/session_01_data_availability.md section 2.2 and
# sessions_02_03_build_plan.md 2.2: EA's own API publishes XX as its unknown
# country code, which is EA saying it does not know, and is a distinct
# concept from ZZ, which means our own pipeline failed to resolve a value.
# XX must never be conflated with or resolved to ZZ. None of these are
# ISO 3166-1 real countries; is_real_country is False for every one.
# XK is deliberately absent: it is already used de facto for Kosovo.

pseudo_codes:
  XP: {meaning: "portfolio seller pool, origin unspecified"}
  XM: {meaning: "multiple or unspecified destination"}
  XR: {meaning: "reload or transhipment origin"}
  XL: {meaning: "the literal Liquefied Natural Gas value in IEA GTF exit and entry columns"}
  XN: {meaning: "not elsewhere specified, as used in IEA GTF"}
  XX: {meaning: "EA API's own unknown country code, distinct from ZZ"}
  ZZ: {meaning: "unknown, error trapping only"}

# Exact, case-insensitive raw-string matches that resolve to a pseudo code
# at high confidence (build plan 4.4: "an exact match to a known pseudo code
# case such as Portfolio to XP or Multiple to XM"). Not a fuzzy or partial
# match: the raw_value must equal the alias exactly, case folded only.
pseudo_code_aliases:
  portfolio: XP
  multiple: XM
  "liquefied natural gas": XL
  "not elsewhere specified": XN
